spring:
  application:
    name: inventory-service
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/inventory_db
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: REDIS
    redis:
      time-to-live: 600000ms
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
logging:
  level:
    org.springframework.kafka: DEBUG
server:
  port: 8081